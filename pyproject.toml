[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-vuln-repair"
version = "0.3.0"
description = "Evidence-driven repair for C/C++ source projects and rehosted IoT firmware"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "pyelftools>=0.32,<1", "tree-sitter>=0.24,<0.26", "tree-sitter-c>=0.23,<0.25", "tree-sitter-cpp>=0.23,<0.24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
repair = "repair_tool.cli:main"

[tool.setuptools.packages.find]
include = ["repair_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: process, compiler or platform integration tests",
    "slow: long-running tests such as real-rootfs rehosting smoke tests",
]
